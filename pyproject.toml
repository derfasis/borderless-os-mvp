[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "borderless-os-mvp"
version = "0.1.0"
description = "Source-first prototype for Croatian legal document retrieval (not legal advice)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "pymupdf>=1.24,<2",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
borderless_os = ["demo.html"]
